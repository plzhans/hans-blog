# Notion 데이터베이스 프로퍼티 매핑
# 노션 DB의 프로퍼티 이름이 변경되면 여기서만 수정하면 됩니다.
# 참고: 생성일자(created_time), 수정일자(last_edited_time)는 page 고유 필드이므로 설정 불필요
propertyKeys:
  # 페이지 발행 상태 (status 타입). "발행 요청" 필터 및 "발행" 여부 판단에 사용
  status: "상태"
  # 카테고리 (select/multi_select 타입). Hugo content 경로 및 front-matter categories에 사용
  category: "카테고리"
  # 태그 (multi_select/select/rich_text 타입). Hugo front-matter tags에 사용
  tags: "태그"
  # 고유 식별자 (unique_id 타입). Hugo front-matter id 및 url에 사용
  uniqueId: "POST_ID"
  # 생성일 (date/created_time 타입). 페이지 프로퍼티에 해당 컬럼이 있으면 사용, 없으면 page.created_time 사용
  createdDate: "생성일"
  # 발행일 (date 타입). 발행 완료 시 현재 시간으로 자동 업데이트
  publishedDate: "발행일"
  # 발행 URL (url 타입). 발행 완료 시 실제 발행된 URL로 자동 업데이트
  publishUrl: "발행 URL"
  # 발행 결과 (rich_text 타입). 발행 성공/실패 시 결과 메시지 기록 (CI가 무인 실행되어
  # 콘솔 로그를 못 보므로, 노션에서 바로 확인할 수 있게 함)
  publishResult: "발행 결과"
  # ── 링크드인 ──
  # 게시 문구 (rich_text). 사람이 노션에서 다듬은 뒤 버튼을 누른다
  linkedinText: "링크드인 문구"
  # 게시물 URL (url). 값이 있으면 "이미 게시됨" 으로 보고 재게시를 막는다.
  # 상태를 따로 기억하는 컬럼이 없는 이유 - 이 칸의 유무가 곧 상태다
  linkedinUrl: "링크드인 URL"
  # 게시 결과 (rich_text). 실패 사유를 남긴다. "발행 결과" 를 재활용하면
  # 다음 동기화가 덮어써서 지워지므로 따로 둔다
  linkedinResult: "링크드인 결과"
  # 게시일 (date). 선택 - 노션에 컬럼을 안 만들었으면 이 줄을 지우면 기록하지 않는다
  linkedinDate: "링크드인 게시일"

# Hugo 사이트 기본 URL. 발행 URL 생성에 사용 (baseURL/{POST_ID}-{slug}/)
hugoBaseUrl: "https://blog.plzhans.com"

# 상태 프로퍼티 값 매핑
statusValues:
  # DB 필터 조건으로 사용. 이 값과 일치하는 페이지만 동기화 대상
  publishRequest: "발행 요청"
  # 발행 여부 판단. 상태 이름에 이 값이 포함되면 draft: false 처리
  publish: "발행"
