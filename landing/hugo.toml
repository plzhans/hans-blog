# 루트 도메인(plzhans.com) 전용 랜딩 페이지. blog.plzhans.com(../hugo)과는 완전히
# 별도의 Hugo 인스턴스 — baseURL도, 배포 대상(Cloudflare Pages)도 다르기 때문.
# 로컬 미리보기: hugo server -s ./landing --port 1314 (package.json의 landing:watch)
baseURL = 'https://plzhans.com'
title = "손원철 (plzhans)"
locale = 'ko-kr'

enableRobotsTXT = true
# 원페이지 사이트라 카테고리/태그·섹션 목록·RSS 피드 자체가 불필요(robots.txt/sitemap/404는 유지)
disableKinds = ["taxonomy", "term", "section", "rss"]

# 사이트맵 구성 (이 도메인의 사이트맵은 서로 다른 빌드에서 나와 빌드 시점에 합칠 수 없다)
#
#   /sitemap.xml          sitemapindex. static/sitemap.xml 에 정적 파일로 둔다.
#                         항목이 거의 바뀌지 않아 템플릿으로 만들 이유가 없다.
#                         사이트맵이 늘면 그 파일에 <sitemap> 블록을 하나 추가할 것.
#                         기계 판독용으로 공개되는 파일이라 주석은 넣지 않는다 - 설명은 여기에 둔다.
#   /sitemap-landing.xml  이 랜딩(Hugo). 아래 filename 으로 이름을 옮겨 /sitemap.xml 자리를 비워준다.
#   /docs/sitemap.xml     hansapp-docs(VitePress, 별도 repo)가 생성.
#
# lastmod 는 하위 사이트맵이 URL 마다 들고 있으므로 인덱스에 손으로 적지 않는다
# (적어두면 실제 갱신 시점과 어긋나 잘못된 신호가 된다).
#
# 주의: TOML 테이블([sitemap])은 최상위 키(disableKinds 등)보다 뒤에 와야 한다.
# 앞에 두면 뒤따르는 최상위 키가 이 테이블 안으로 들어가 조용히 무시된다.
[sitemap]
  filename = "sitemap-landing.xml"

[params]
  description = "MediFinder 병원 찾기, Telegram Exporter, Hans API 등 직접 만든 서비스를 한 곳에서. 만든 과정은 블로그에 기록합니다."
  blogURL = "https://blog.plzhans.com"
  privacyURL = "https://blog.plzhans.com/privacy/"
  [[params.social]]
    name = "GitHub"
    url = "https://github.com/plzhans"
  [[params.social]]
    name = "LinkedIn"
    url = "https://www.linkedin.com/in/plzhans"

  # 애드센스 심사 대상 도메인이 plzhans.com이라 루트에도 로더 스크립트를 싣는다.
  # 랜딩은 한 페이지뿐이라 광고 유닛(ins 태그)은 두지 않고 로더만 둔다 - 심사에 필요한 건
  # 사이트에 코드가 존재하는 것이고, 한 장짜리 페이지에 광고를 얹을 자리도 마땅치 않다.
  [params.adsense]
    publisherId = "ca-pub-6229891888422992"
    # 최신 글 목록과 Services 사이에 들어가는 인콘텐츠 광고 슬롯.
    # TODO: 지금은 blog의 본문 하단 유닛(adSlotArticleBottom)을 그대로 쓰고 있다.
    # 동작에는 문제가 없지만(광고 유닛은 사이트에 묶이지 않음) 리포트에서 blog 수익과
    # 섞여 구분이 안 되므로, 애드센스 콘솔에서 랜딩 전용 유닛을 만들어 이 값만 교체할 것.
    adSlotContent = "8636834920"

[services]
  [services.googleAnalytics]
    ID = "G-3MLM9NWMK8"
