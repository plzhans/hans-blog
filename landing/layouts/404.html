<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>페이지를 찾을 수 없습니다 · HansApp</title>
  <meta name="robots" content="noindex">
  <style>
    :root {
      --primary: #2b8a5e;
      --text: #16202a;
      --muted: #57636e;
      --bg: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: var(--text);
      background: var(--bg);
    }
    .wrap { padding: 2rem; max-width: 28rem; }
    h1 { font-size: 2rem; margin: 0 0 0.75rem; }
    p { color: var(--muted); margin: 0 0 1.75rem; }
    a {
      display: inline-block;
      background: var(--primary);
      color: #fff;
      font-weight: 700;
      padding: 0.75rem 1.5rem;
      border-radius: 999px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>페이지를 찾을 수 없습니다</h1>
    <p>주소가 바뀌었거나 삭제된 페이지입니다.</p>
    <a href="/">홈으로 돌아가기</a>
  </div>
</body>
</html>
