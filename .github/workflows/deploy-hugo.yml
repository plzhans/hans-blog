name: Deploy Hugo

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/deploy-hugo.yml"
      - "hugo/**"
      - "content/**"
      - "data/**"

  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      HUGO_BASEURL: https://blog.plzhans.com
      HUGO_CACHEDIR: /tmp/hugo_cache

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      - name: Cache Hugo
        uses: actions/cache@v4
        with:
          path: ${{ env.HUGO_CACHEDIR }}
          key: ${{ runner.os }}-hugomod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-hugomod-

      - name: Build
        run: hugo -s ./hugo --baseURL $HUGO_BASEURL --minify --gc --cleanDestinationDir

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./hugo/public

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Print deployed URL
        run: echo "Deployed to ${{ steps.deploy.outputs.page_url }}"

      - name: Submit URLs to IndexNow
        env:
          INDEXNOW_KEY: a147cb4e39957f43ac4c2089298ab0c0
        run: |
          set -euo pipefail
          urls=$(grep -ohE '<loc>[^<]+</loc>' \
            hugo/public/ko/sitemap.xml \
            hugo/public/en/sitemap.xml \
            hugo/public/ja/sitemap.xml \
            | sed -E 's#</?loc>##g')
          url_list=$(printf '%s\n' "$urls" | jq -R . | jq -s .)
          payload=$(jq -n \
            --arg host "blog.plzhans.com" \
            --arg key "$INDEXNOW_KEY" \
            --arg keyLocation "https://blog.plzhans.com/${INDEXNOW_KEY}.txt" \
            --argjson urlList "$url_list" \
            '{host: $host, key: $key, keyLocation: $keyLocation, urlList: $urlList}')
          curl -sS -X POST https://api.indexnow.org/indexnow \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$payload" \
            -w "\nIndexNow response: %{http_code}\n"
