name: Deploy Hugo

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/deploy-hugo.yml"
      - "hugo/**"
      - "content/**"
      - "data/**"
      - "landing/**"

  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      HUGO_CACHEDIR: /tmp/hugo_cache

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 버전을 고정하는 이유는 wrangler/compatibility_date와 같다 - 배포할 때마다 다른
      # 판본이 잡히면 같은 소스를 다시 올려도 산출물이 달라질 수 있다. Hugo는 특히
      # 이미지 처리 파일명에 붙는 _hu_ 해시가 판본 영향을 받는데, 랜딩이 blog의 처리
      # 이미지를 크로스도메인으로 핫링크하고 있어서 해시가 바뀌면 그 링크가 깨진다.
      # 올릴 때는 로컬(README/setup.md)도 같이 맞출 것.
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.166.0"
          extended: true

      # 검색 인덱스를 굽는 Pagefind 가 devDependency 라 노드가 필요하다. 로컬과 같은
      # 판본을 쓰도록 .nvmrc 를 따르고, package-lock.json 에 고정된 것을 npm ci 로
      # 그대로 설치한다 (npx 로 받으면 로컬과 다른 판본이 잡힐 수 있다).
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # 루트는 검색 인덱스를 굽는 pagefind 때문에, landing 은 배포 도구 wrangler 때문에
      # 필요하다. 둘은 서로 다른 배포 단위라 package.json 을 따로 들고 있다 - wrangler 는
      # workerd 바이너리까지 236MB 라 루트에 두면 Notion 동기화 워크플로들까지 끌어쓴다.
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix landing

      - name: Cache Hugo
        uses: actions/cache@v4
        with:
          path: ${{ env.HUGO_CACHEDIR }}
          key: ${{ runner.os }}-hugomod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-hugomod-

      - name: Build
        env:
          HUGO_BASEURL: https://blog.plzhans.com
        run: hugo -s ./hugo --baseURL $HUGO_BASEURL --minify --gc --cleanDestinationDir

      # Pagefind 는 Hugo 가 만든 HTML 을 읽어 인덱스를 hugo/public/pagefind/ 에 떨구는
      # 후처리 도구다. **반드시 Build 뒤, 아티팩트 업로드 전에** 돌아야 한다 - 이 스텝이
      # 빠지면 /search/ 페이지만 배포되고 인덱스가 없어 검색창이 빈 채로 뜬다.
      - name: Build search index
        run: npm run pagefind:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./hugo/public

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Print deployed URL
        run: echo "Deployed to ${{ steps.deploy.outputs.page_url }}"

      # 루트 도메인(plzhans.com) 랜딩 페이지 — blog와 같은 잡에서 빌드해야
      # hugo/public/index.json(최신 글 목록)을 네트워크 fetch 없이 그대로 복사해 쓸 수 있음.
      # blog_posts.json 은 추적하지 않으므로(생성물) 새 클론에는 landing/data 디렉터리 자체가
      # 없다 - mkdir 없이 cp 하면 "No such file or directory" 로 죽는다.
      - name: Copy latest/popular posts data for landing
        run: |
          mkdir -p landing/data
          cp hugo/public/index.json landing/data/blog_posts.json

      # HUGO_BASEURL 환경변수는 --baseURL CLI 플래그보다 우선순위가 높다. 잡 레벨에 두면
      # 다른 빌드 스텝에 값이 새어 들어갈 수 있어(실제로 blog용 값이 랜딩 빌드에 새어 들어가
      # canonical/og:url/sitemap이 전부 blog 도메인으로 나가는 버그가 있었다) 스텝별로 국지화한다.
      - name: Build landing
        env:
          HUGO_BASEURL: https://plzhans.com
        run: hugo -s ./landing --baseURL https://plzhans.com --minify --gc --cleanDestinationDir

      # Pages가 아니라 Workers Static Assets로 배포한다 (계정의 다른 프론트엔드들과 동일한 방식).
      # 버전은 landing/package-lock.json 에 고정돼 있다. 배포할 때마다 다른 판본이 잡히면
      # 같은 산출물을 다시 올려도 동작이 달라질 수 있어서, hugo.toml 의 compatibility_date 를
      # 고정하는 것과 같은 이유로 락파일에 박아둔다. develop 배포도 같은 락파일을 쓴다.
      - name: Deploy landing to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CI: "true"
          WRANGLER_SEND_METRICS: "false"
        run: |
          cd landing
          npm run deploy -- \
            --tag "${{ github.sha }}" \
            --message "ref: ${{ github.ref_name }}"

      - name: Submit URLs to IndexNow
        env:
          INDEXNOW_KEY: a147cb4e39957f43ac4c2089298ab0c0
        run: |
          set -euo pipefail
          urls=$(grep -ohE '<loc>[^<]+</loc>' \
            hugo/public/ko/sitemap.xml \
            hugo/public/en/sitemap.xml \
            hugo/public/ja/sitemap.xml \
            | sed -E 's#</?loc>##g')
          url_list=$(printf '%s\n' "$urls" | jq -R . | jq -s .)
          payload=$(jq -n \
            --arg host "blog.plzhans.com" \
            --arg key "$INDEXNOW_KEY" \
            --arg keyLocation "https://blog.plzhans.com/${INDEXNOW_KEY}.txt" \
            --argjson urlList "$url_list" \
            '{host: $host, key: $key, keyLocation: $keyLocation, urlList: $urlList}')
          curl -sS -X POST https://api.indexnow.org/indexnow \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$payload" \
            -w "\nIndexNow response: %{http_code}\n"

      # IndexNow는 제출 host와 keyLocation의 host가 같아야 해서 blog와 별도 제출이 필요함
      # (landing/static/<key>.txt에 같은 키 파일을 복사해둠).
      - name: Submit landing URLs to IndexNow
        env:
          INDEXNOW_KEY: a147cb4e39957f43ac4c2089298ab0c0
        run: |
          set -euo pipefail
          # sitemap.xml은 하위 사이트맵을 묶는 sitemapindex라 <loc>이 페이지가 아니라
          # 사이트맵 파일을 가리킨다. 실제 페이지 URL은 sitemap-landing.xml에 있다.
          # /docs/sitemap.xml은 별도 repo(hansapp-docs)가 빌드·배포하므로 여기서 제출하지 않는다.
          urls=$(grep -ohE '<loc>[^<]+</loc>' landing/public/sitemap-landing.xml | sed -E 's#</?loc>##g')
          url_list=$(printf '%s\n' "$urls" | jq -R . | jq -s .)
          payload=$(jq -n \
            --arg host "plzhans.com" \
            --arg key "$INDEXNOW_KEY" \
            --arg keyLocation "https://plzhans.com/${INDEXNOW_KEY}.txt" \
            --argjson urlList "$url_list" \
            '{host: $host, key: $key, keyLocation: $keyLocation, urlList: $urlList}')
          curl -sS -X POST https://api.indexnow.org/indexnow \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$payload" \
            -w "\nIndexNow response: %{http_code}\n"
