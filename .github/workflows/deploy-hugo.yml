name: Deploy Hugo

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/deploy-hugo.yml"
      - "hugo/**"
      - "content/**"
      - "data/**"
      - "landing/**"

  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      HUGO_BASEURL: https://blog.plzhans.com
      HUGO_CACHEDIR: /tmp/hugo_cache
      WRANGLER_VERSION: 4.129.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      - name: Cache Hugo
        uses: actions/cache@v4
        with:
          path: ${{ env.HUGO_CACHEDIR }}
          key: ${{ runner.os }}-hugomod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-hugomod-

      - name: Build
        run: hugo -s ./hugo --baseURL $HUGO_BASEURL --minify --gc --cleanDestinationDir

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./hugo/public

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Print deployed URL
        run: echo "Deployed to ${{ steps.deploy.outputs.page_url }}"

      # 루트 도메인(plzhans.com) 랜딩 페이지 — blog와 같은 잡에서 빌드해야
      # hugo/public/index.json(최신 글 목록)을 네트워크 fetch 없이 그대로 복사해 쓸 수 있음.
      - name: Copy latest/popular posts data for landing
        run: cp hugo/public/index.json landing/data/blog_posts.json

      - name: Build landing
        run: hugo -s ./landing --baseURL https://plzhans.com --minify --gc --cleanDestinationDir

      # npx가 매 실행마다 wrangler를 새로 받으면 이 스텝만 수 분씩 걸린다 - npm 캐시로 완화.
      # 버전을 고정하는 이유는 hugo.toml의 compatibility_date를 고정하는 이유와 같다:
      # 배포할 때마다 다른 버전이 잡히면 같은 산출물을 다시 올려도 동작이 달라질 수 있다.
      - name: Cache npm (wrangler)
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-wrangler-${{ env.WRANGLER_VERSION }}

      # Pages가 아니라 Workers Static Assets로 배포한다 (계정의 다른 프론트엔드들과 동일한 방식).
      - name: Deploy landing to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd landing
          CI=true WRANGLER_SEND_METRICS=false npx "wrangler@$WRANGLER_VERSION" deploy \
            --tag "${{ github.sha }}" \
            --message "ref: ${{ github.ref_name }}"

      - name: Submit URLs to IndexNow
        env:
          INDEXNOW_KEY: a147cb4e39957f43ac4c2089298ab0c0
        run: |
          set -euo pipefail
          urls=$(grep -ohE '<loc>[^<]+</loc>' \
            hugo/public/ko/sitemap.xml \
            hugo/public/en/sitemap.xml \
            hugo/public/ja/sitemap.xml \
            | sed -E 's#</?loc>##g')
          url_list=$(printf '%s\n' "$urls" | jq -R . | jq -s .)
          payload=$(jq -n \
            --arg host "blog.plzhans.com" \
            --arg key "$INDEXNOW_KEY" \
            --arg keyLocation "https://blog.plzhans.com/${INDEXNOW_KEY}.txt" \
            --argjson urlList "$url_list" \
            '{host: $host, key: $key, keyLocation: $keyLocation, urlList: $urlList}')
          curl -sS -X POST https://api.indexnow.org/indexnow \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$payload" \
            -w "\nIndexNow response: %{http_code}\n"
