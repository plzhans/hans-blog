# 기본 URL (빌드 시 --baseURL 플래그로 설정)
baseURL = 'https://blog.plzhans.com'
# 제목
title = "plzhans blog"
# 언어 코드
locale = 'ko-kr'

# 사용할 Hugo 테마
theme = "m10c"

# 기본 콘텐츠 언어
defaultContentLanguage = "ko"
# 기본 언어도 서브디렉토리에 포함 (/ko/)
defaultContentLanguageInSubdir = false

# robots.txt 파일 자동 생성
enableRobotsTXT = true
# 콘텐츠 디렉토리 경로 (기본값: content)
contentDir = "../content"
dataDir = "../data"

# 목록 페이지 페이지네이션 (페이지당 글 수)
[pagination]
  pagerSize = 20

# llms.txt 생성용 커스텀 output format (홈페이지에 연결, 게시물 추가 시 자동 반영)
[outputFormats.LLMS]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
  notAlternative = true

[outputs]
  # JSON: 루트 도메인 랜딩 페이지(../landing)가 빌드 시점에 최신 글 목록을 읽어가는 용도
  home = ["HTML", "RSS", "LLMS", "JSON"]

# 다국어 설정
[languages]
  [languages.ko]
    weight = 1
    label = "한국어"

  [languages.en]
    weight = 2
    label = "English"
    [languages.en.params]
      description = "A blog documenting the troubleshooting behind things I've built."
      authorRealName = "Son Won Chul"

  [languages.ja]
    weight = 3
    label = "日本語"
    [languages.ja.params]
      description = "開発で構築したもののトラブルシューティング記録を残すブログです。"
      authorRealName = "Son Won Chul"

# 사이트 파라미터 설정
[params]
  # 작성자 이름
  author = "plzhans"
  # 저자 실명 (스키마의 Person.name 엔티티 식별용, UI 표시에는 사용하지 않음)
  authorRealName = "손원철"
  # 사이트 설명
  description = "개발하며 구축한 것들의 트러블슈팅 기록을 남기는 블로그입니다."
  # 프로필 이미지 경로
  avatar = "/assets/img/avatar-plzhans.webp"
  # 홈/목록 등 자체 이미지가 없는 페이지의 기본 og:image (social-image.html 폴백)
  images = ["/assets/img/og-default.jpg"]
  # 저작권 표시 HTML
  CopyrightHTML = 'Copyright &#xA9; plzhans. All Rights Reserved. | Powered by <a href="https://github.com/plzhans/hans-blog" target="_blank">github.com/plzhans/hans-blog</a>'
  # 메뉴 아이템 구분자
  menu_item_separator = ""
  [[params.social]]
    icon = "brand-github"
    name = "Github"
    url = "https://github.com/plzhans"
  [[params.social]]
    icon = "brand-linkedin"
    name = "LinkedIn"
    url = "https://www.linkedin.com/in/plzhans"
  [[params.social]]
    icon = "code"
    name = "Source"
    url = "https://github.com/plzhans/hans-blog"
    branch = "master"
    contentPrefix = "content"
  [[params.social]]
    icon = "mail"
    name = "Email"
    url = "mailto:plzhans@gmail.com"

  [params.style]
    darkestColor = "#f0f2f5"
    darkColor = "#ffffff"
    lightColor = "#4a5568"
    lightestColor = "#1a202c"
    primaryColor = "#2b8a5e"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = false
    style = "github"
    lineNos = true
    lineNumbersInTable = false

[taxonomies]
  category = "categories"
  tag = "tags"

[related]
  includeNewer = true
  threshold = 20
  toLower = false
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "categories"
    weight = 70
  [[related.indices]]
    name = "date"
    weight = 10

# URL 구조 설정 - slug만 사용
[permalinks]
  posts = "/posts/:slug/"
  _redirect = "/:slug/"

[params.giscus]
  repo = "plzhans/hans-blog"
  repoId = "R_kgDORDHy7g"
  category = "General"
  categoryId = "DIC_kwDORDHy7s4C1zoX"
  mapping = "pathname"
  reactionsEnabled = "1"
  emitMetadata = "0"
  inputPosition = "top"
  theme = "light"
  lang = "ko"

# AdSense 승인 전까지 임시 비활성화 (주석 해제 시 스크립트/광고 렌더링 재개)
# [params.adsense]
#   publisherId = "ca-pub-6229891888422992"
#   adSlotArticleBottom = "8636834920"
#   adSlotSidebar = "3576079939"

[services]
  [services.googleAnalytics]
    ID = "G-7QCWSVX3WN"
